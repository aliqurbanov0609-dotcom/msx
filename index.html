<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MSX Personal Launcher 1.0</title>
<style>
:root{
  --bg:#05080d; --panel:rgba(12,19,29,.86); --line:rgba(255,255,255,.13);
  --text:#f4f7fb; --muted:#91a0b5; --accent:#19e6a1; --shadow:0 16px 45px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:Arial,Helvetica,sans-serif}
body{
  background:
   radial-gradient(circle at 72% 15%,rgba(18,103,177,.24),transparent 35%),
   radial-gradient(circle at 18% 80%,rgba(0,211,149,.13),transparent 34%),
   linear-gradient(135deg,#03060a,#07111b 52%,#020408);
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;
 background:linear-gradient(120deg,transparent 0 45%,rgba(255,255,255,.025) 50%,transparent 55%);
}
header{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}
.logo{font-weight:900;letter-spacing:2px;font-size:31px}.logo span{color:#45a7ff}
.sub{font-size:11px;color:#738198;letter-spacing:3px;margin-left:14px}
.clock{text-align:right}.time{font-size:25px;font-weight:700}.date{font-size:12px;color:var(--muted);margin-top:4px}
main{height:calc(100vh - 145px);padding:8px 4vw 15px;display:flex;flex-direction:column;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1500px;width:100%;margin:auto}
.card{
 height:165px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(20,30,43,.94),rgba(6,11,18,.86));
 box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;justify-content:space-between;
 position:relative;overflow:hidden;outline:none;transition:.16s transform,.16s border-color,.16s box-shadow;
}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.035),transparent);pointer-events:none}
.card.focus{transform:scale(1.035);border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(25,230,161,.11),0 20px 60px rgba(0,0,0,.58)}
.icon{font-size:43px;line-height:1}.title{font-size:25px;font-weight:800}.desc{font-size:13px;color:var(--muted);margin-top:5px}.arrow{position:absolute;right:18px;bottom:18px;font-size:26px;color:#8ca0b8}
.card[data-color="blue"].focus{--accent:#3da5ff}.card[data-color="purple"].focus{--accent:#bb70ff}
.card[data-color="orange"].focus{--accent:#ffb43d}.card[data-color="red"].focus{--accent:#ff5f67}
footer{height:53px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;color:#718096;font-size:12px}
.nav span{margin-right:25px}.nav b{color:#cdd7e5}.hint{letter-spacing:1px}
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(15px);opacity:0;
background:rgba(4,8,13,.94);border:1px solid rgba(255,255,255,.18);padding:11px 18px;border-radius:10px;
font-size:13px;transition:.2s;pointer-events:none}.show{opacity:1!important;transform:translateX(-50%) translateY(0)!important}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.card{height:145px}}
</style>
</head>
<body>
<header>
  <div><span class="logo">MS<span>X</span></span><span class="sub">PERSONAL LAUNCHER</span></div>
  <div class="clock"><div id="time" class="time">--:--</div><div id="date" class="date">--</div></div>
</header>

<main>
  <section id="grid" class="grid" aria-label="MSX launcher"></section>
</main>

<footer>
  <div class="nav"><span>← ↑ ↓ → <b>Навигация</b></span><span>OK <b>Запуск</b></span><span>BACK <b>Назад</b></span></div>
  <div class="hint">MSX PERSONAL LAUNCHER · v1.0</div>
</footer>
<div id="toast"></div>

<script>
/*
  MSX Personal Launcher 1.0
  Меняй только URL ниже.
  Если сервис имеет отдельный TV/web-адрес — укажи его здесь.
  Для native-app URI оставляй схему, которую поддерживает конкретный TV/app.
*/
const APP_URLS = {
  music:   "https://open.spotify.com/",
  youtube: "https://www.youtube.com/tv#/",
  vk:      "https://vk.com/video",
  films:   "https://lampa.mx/",
  tv:      "https://example.com/",
  torrent: "http://127.0.0.1:8090/",
  web:     "https://www.google.com/",
  games:   "https://www.crazygames.com/",
  files:   "about:blank",
  settings:"about:blank",
  tools:   "about:blank",
  favorites:"about:blank"
};

const items = [
 {id:"music", icon:"♫", title:"Music", desc:"Spotify", color:"green"},
 {id:"video", icon:"▶", title:"Video", desc:"YouTube · VK Video · Etc.", color:"red", children:[
   ["YouTube",APP_URLS.youtube],["VK Video",APP_URLS.vk]
 ]},
 {id:"films", icon:"◉", title:"Films", desc:"Lampa", color:"purple"},
 {id:"tv", icon:"▣", title:"TV", desc:"IPTV · TV Player", color:"blue"},
 {id:"apps", icon:"◆", title:"Apps", desc:"TorrServe Matrix · Etc.", color:"green", children:[
   ["TorrServe Matrix",APP_URLS.torrent]
 ]},
 {id:"web", icon:"◎", title:"Web", desc:"Browser", color:"blue"},
 {id:"games", icon:"✚", title:"Games", desc:"Play & Enjoy", color:"orange"},
 {id:"favorites", icon:"★", title:"Favorites", desc:"Your Apps", color:"orange"},
 {id:"files", icon:"▰", title:"Files", desc:"File Manager", color:"blue"},
 {id:"settings", icon:"⚙", title:"Settings", desc:"System Settings", color:"blue"},
 {id:"tools", icon:"⚒", title:"Tools", desc:"Useful Apps", color:"purple"},
 {id:"power", icon:"⏻", title:"Power", desc:"Shutdown / Reboot", color:"red"}
];

const grid=document.getElementById("grid");
const toast=document.getElementById("toast");
let focusIndex=0;

function render(){
  grid.innerHTML="";
  items.forEach((x,i)=>{
    const el=document.createElement("div");
    el.className="card"+(i===focusIndex?" focus":"");
    el.dataset.color=x.color;
    el.tabIndex=0;
    el.innerHTML=`<div class="icon">${x.icon}</div><div><div class="title">${x.title}</div><div class="desc">${x.desc}</div></div><div class="arrow">›</div>`;
    el.onclick=()=>activate(i);
    grid.appendChild(el);
  });
}
function setFocus(i){
  focusIndex=(i+items.length)%items.length;
  [...grid.children].forEach((e,n)=>e.classList.toggle("focus",n===focusIndex));
}
function activate(i){
  const x=items[i];
  if(x.children){
    showToast(x.children.map(a=>a[0]).join("  •  "));
    // If a tile has sub-apps, first OK opens the first item.
    const first=x.children[0];
    setTimeout(()=>openURL(first[1],first[0]),350);
    return;
  }
  if(x.id==="power"){showToast("Power menu: connect to the TV/system action you use");return;}
  openURL(APP_URLS[x.id] || "about:blank",x.title);
}
function openURL(url,name){
  if(!url || url==="about:blank"){showToast(name+" — URL пока не настроен");return;}
  showToast("Открывается: "+name);
  window.location.href=url;
}
function showToast(t){
  toast.textContent=t;toast.classList.add("show");
  clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),1800);
}
function updateClock(){
 const d=new Date();
 document.getElementById("time").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
 document.getElementById("date").textContent=d.toLocaleDateString("ru-RU",{weekday:"long",day:"2-digit",month:"long"});
}
document.addEventListener("keydown",e=>{
 const k=e.key;
 if(["ArrowRight","ArrowLeft","ArrowUp","ArrowDown","Enter","Escape","Backspace"].includes(k)) e.preventDefault();
 if(k==="ArrowRight")setFocus(focusIndex+1);
 if(k==="ArrowLeft")setFocus(focusIndex-1);
 if(k==="ArrowDown")setFocus(focusIndex+4);
 if(k==="ArrowUp")setFocus(focusIndex-4);
 if(k==="Enter")activate(focusIndex);
 if(k==="Escape"||k==="Backspace")showToast("Назад");
});
render();updateClock();setInterval(updateClock,1000);
</script>
</body>
</html>
